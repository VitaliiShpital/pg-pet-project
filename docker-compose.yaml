services:
  # =========================================================================
  # INFRASTRUCTURE SERVICES
  # =========================================================================

  postgres:
    image: postgis/postgis:16-3.4
    container_name: air_defense_postgres
    environment:
      POSTGRES_DB: air_defense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/migrations/000001_init_air_defense_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d air_defense"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: air_defense_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  nats:
    image: nats:2.9.19
    container_name: air_defense_nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  # =========================================================================
  # GO APPLICATION SERVICES
  # =========================================================================

  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: ingestion
    container_name: air_defense_ingestion
    environment:
      - NATS_URL=nats://nats:4222
      - MQTT_URL=tcp://mosquitto:1883
    depends_on:
      - mosquitto
      - nats
    restart: on-failure

  fusion:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: fusion
    container_name: air_defense_fusion
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats
    restart: on-failure

  storage:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SERVICE_NAME: storage
    container_name: air_defense_storage
    environment:
      - NATS_URL=nats://nats:4222
      - POSTGRES_DSN=postgres://postgres:postgres_password@postgres:5432/air_defense?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: on-failure

volumes:
  postgres_data:
